name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            runner: ubuntu-24.04
            use_cross: false
            binary_suffix: ""
          - target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            runner: ubuntu-24.04
            use_cross: true
            binary_suffix: ""
          - target: aarch64-apple-darwin
            asset: macos-arm64
            runner: macos-14
            use_cross: false
            binary_suffix: ""
          - target: aarch64-pc-windows-msvc
            asset: windows-arm64
            runner: windows-latest
            use_cross: false
            binary_suffix: .exe
          - target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            runner: windows-latest
            use_cross: false
            binary_suffix: .exe
          - target: x86_64-unknown-linux-musl
            asset: linux-musl-x86_64
            runner: ubuntu-24.04
            use_cross: true
            binary_suffix: ""
          - target: aarch64-unknown-linux-musl
            asset: linux-musl-arm64
            runner: ubuntu-24.04
            use_cross: true
            binary_suffix: ""

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify release tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${RELEASE_TAG#v}"
          package_version="$(awk -F'"' '$1 ~ /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          test -n "${package_version}"
          test "${tag_version}" = "${package_version}" || {
            printf 'Release tag %s does not match Cargo version %s\n' "${RELEASE_TAG}" "${package_version}" >&2
            exit 1
          }

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Build release binary with cross
        if: matrix.use_cross
        run: cross build --locked --release --target "${{ matrix.target }}"

      - name: Package release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          package_name="keyben-${RELEASE_TAG}-${ASSET}"
          package_dir="dist/${package_name}"
          binary="target/${TARGET}/release/keyben${BINARY_SUFFIX}"

          test -f "${binary}"
          mkdir -p "${package_dir}"
          cp "${binary}" "${package_dir}/keyben${BINARY_SUFFIX}"
          cp README.md LICENSE "${package_dir}/"
          tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"

          printf 'Packaged keyben %s for %s (%s)\n' "${version}" "${ASSET}" "${TARGET}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: keyben-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: keyben-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz | sort -k2 > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: keyben ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
