[package]
name = "keyben"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["zeroize"] }
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
hkdf = "0.13.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["validate-request", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.0"

[dev-dependencies]
# Drives the real Router through tower's ServiceExt so route tests exercise the actual table.
tower = { version = "0.5.3", features = ["util"] }

# Optimize the shipped single-binary artifact for size and speed. Unwinding is kept on
# purpose: a panic that aborts would skip the destructors that wipe key material.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
